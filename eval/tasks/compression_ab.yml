# Realistic-coding-task suite for the tool-output-compression A/B (#533).
#
# Each task makes the agent emit a LARGE output into one tool call so the
# compressed payload is a BIG fraction of the turn (not swamped by the system
# prompt + tool schemas). One task per compressed channel, plus a non-Ruby
# control that confirms the code skeletoner is Ruby-only.
#
# All are `find` kind: the agent's final answer is written to RESULT.txt and the
# check greps it for a deterministic anchor. The anchor is something the
# compressor KEEPS, so a correct answer proves compression didn't hide the
# signal the agent needed.

# 1) TEST-LOG channel → LogCompressor. The agent dumps a real 8541-line rspec
#    run (21 failures buried in passing/doc noise) and must name a failing
#    example. The compressor keeps every failure + the summary; the answer
#    proves the failure survived. Big-ROI channel.
- id: ab_testlog
  kind: find
  fixture: ab_testlog
  prompt: >
    Run the shell command `cat rspec_output.txt` to see a test-suite run, then
    tell me: in the Failures section, the secret-redaction spec asserts a
    specific path should be treated as a secret but the assertion failed — which
    absolute filesystem path is it? Put just that path in your final answer.
  check: "grep -Eq '/etc/sudoers' RESULT.txt"

# 2) DIFF channel → DiffCompressor. The agent dumps a 1342-line, 9-file unified
#    diff and must report which file the diff touches FIRST. The compressor
#    keeps every file/hunk header, so the answer survives.
- id: ab_diff
  kind: find
  fixture: ab_diff
  prompt: >
    Run the shell command `cat changes.diff` to see a unified diff of several
    files, then tell me the path of the VERY FIRST file changed in the diff
    (the one in the first `diff --git` header). Put just that path
    (e.g. lib/foo/bar.rb) in your final answer.
  check: "grep -Eq 'lib/rubino/agent/tool_executor\\.rb' RESULT.txt"

# 3) JSON channel → JsonCompressor. The agent dumps a 100-pod kubectl JSON and
#    must name the pod that is crash-looping. The compressor keeps error/outlier
#    rows verbatim, so the bad pod survives the table fold.
- id: ab_json
  kind: find
  fixture: ab_json
  prompt: >
    Run the shell command `cat pods.json` to see a list of Kubernetes pods as
    JSON, then tell me the `name` of the pod whose `phase` is
    "CrashLoopBackOff". Put just that pod name in your final answer.
  check: "grep -Eq 'web-042' RESULT.txt"

# 4) RUBY-CODE channel → code skeleton. The agent reads a 672-line Ruby file
#    WHOLE and must report a class it defines. The skeleton keeps class/method
#    signatures, so the structure survives the body elision.
- id: ab_code_rb
  kind: find
  fixture: ab_code_rb
  prompt: >
    Read the file executor.rb (read the whole file). It defines one main class.
    Tell me the exact name of that class. Put just the class name in your final
    answer.
  check: "grep -Eq 'ToolExecutor' RESULT.txt"

# 5) CONTROL (non-Ruby) → passthrough. Same shape as task 4 but a .py file. The
#    code skeletoner is Ruby-only, so this read is NOT compressed (the ON arm
#    behaves like OFF here). Confirms the Ruby-only limitation in the data.
- id: ab_code_py
  kind: find
  fixture: ab_code_py
  prompt: >
    Read the file executor.py (read the whole file). It defines several classes
    whose names all start with the same word. Tell me that common class-name
    prefix. Put just that one word in your final answer.
  check: "grep -Eqi 'Handler' RESULT.txt"
